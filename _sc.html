<!doctype html><meta charset="utf-8"><title>sc</title>
<style>html,body{margin:0}iframe{width:1400px;height:1000px;border:0}</style>
<iframe id="f" src="index.html#tropisms"></iframe>
<script>
var f=document.getElementById('f'), log=[], errs=[];
window.onerror=function(m){errs.push(m);};
function d(){return f.contentDocument;}
function state(tag){
  var col=d().querySelector('.platecol'), host=d().getElementById('simHost');
  log.push(tag + ': plant=' + (getComputedStyle(d().getElementById('map')).display!=='none') +
           ' drawing=' + (col.classList.contains('is-sim') && !host.hidden) +
           ' pack-in-col=' + !!host.querySelector('.ax__pack'));
}
function scrollTo(px, then){ var p=d().querySelector('.panel'); var b=p.style.scrollBehavior; p.style.scrollBehavior='auto'; p.scrollTop=px; p.style.scrollBehavior=b; setTimeout(then, 700); }
f.onload=function(){ setTimeout(function(){
  state('OPEN (top)');
  var w=d().querySelector('.ax'), p=d().querySelector('.panel');
  var target = w.getBoundingClientRect().top - p.getBoundingClientRect().top + p.scrollTop - 200;
  scrollTo(target, function(){
    state('AT the widget');
    scrollTo(p.scrollHeight, function(){
      state('SCROLLED PAST');
      scrollTo(0, function(){
        state('BACK to top');
        document.title=log.join(' | ')+' || errors='+errs.length+(errs[0]?(' :: '+errs[0]):'');
      });
    });
  });
}, 3000); };
</script>
