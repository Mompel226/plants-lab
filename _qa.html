<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="css/app.css">
<style>body{margin:0;background:#fff}#o{padding:8px}#dump{white-space:pre-wrap;font:10px monospace}</style>
<div id="o"></div><pre id="dump"></pre>
<script src="js/data/glossary.js"></script><script src="js/data/photos.js"></script>
<script src="js/plant.js"></script><script src="js/plant-draw.js"></script>
<script src="js/terms.js"></script><script src="js/widgets.js"></script><script src="js/learn.js"></script>
<script>
var mmReal = window.matchMedia.bind(window);
window.matchMedia = function (q) {
  if (/prefers-reduced-motion/.test(q)) return { matches: true, media: q,
    addEventListener: function(){}, removeEventListener: function(){}, addListener: function(){}, removeListener: function(){} };
  return mmReal(q);
};
var P = new URLSearchParams(location.search);
var clicks = JSON.parse(decodeURIComponent(P.get('c') || '[]'));
var w = window.Learn.widget({ type: 'auxin', title: 'The auxin experiments', ask: 'a' }, {});
document.getElementById('o').appendChild(w);
function go() {
  clicks.forEach(function (l) {
    var ps = w.querySelectorAll('.ax__lamp');
    for (var i = 0; i < ps.length; i++) { if (ps[i].textContent === l) { ps[i].click(); break; } }
  });
  setTimeout(dump, 120);
}
function dump() {
  var stage = w.querySelector('.ax__stage'), svg = stage.querySelector('svg');
  var vb = svg.getAttribute('viewBox').split(/\s+/).map(Number);
  var sr = stage.getBoundingClientRect(), gr = svg.getBoundingClientRect();
  var els = [].slice.call(svg.querySelectorAll('*'));
  var out = { url: location.href, clicks: clicks,
    viewBox: vb, stageRect: [sr.left, sr.top, sr.width, sr.height], svgRect: [gr.left, gr.top, gr.width, gr.height],
    innerW: window.innerWidth, stageClientW: stage.clientWidth, stageScrollW: stage.scrollWidth,
    aria: svg.getAttribute('aria-label'),
    pins: [].slice.call(w.querySelectorAll('.ax__pins li')).map(function (li) { return li.textContent; }),
    keyTxt: w.querySelector('.ax__key').textContent,
    why: w.querySelector('.ax__why').textContent,
    els: [] };
  var scale = gr.width / vb[2];
  els.forEach(function (e, i) {
    e.setAttribute('data-qa', i);
    var b; try { b = e.getBBox(); } catch (err) { b = null; }
    var rec = { i: i, tag: e.tagName, cls: e.getAttribute('class') || '',
      fill: e.getAttribute('fill') || '', stroke: e.getAttribute('stroke') || '',
      op: e.getAttribute('opacity') || '', sw: e.getAttribute('stroke-width') || '',
      da: e.getAttribute('stroke-dasharray') || '',
      txt: e.tagName === 'text' ? e.textContent : '',
      bb: b ? [+b.x.toFixed(2), +b.y.toFixed(2), +b.width.toFixed(2), +b.height.toFixed(2)] : null };
    if (e.tagName === 'circle') rec.c = [+e.getAttribute('cx'), +e.getAttribute('cy'), +e.getAttribute('r')];
    if (e.tagName === 'line') rec.l = [+e.getAttribute('x1'), +e.getAttribute('y1'), +e.getAttribute('x2'), +e.getAttribute('y2')];
    if (e.tagName === 'rect') rec.r = [e.getAttribute('x'), e.getAttribute('y'), e.getAttribute('width'), e.getAttribute('height')];
    if (e.tagName === 'text') rec.t = [e.getAttribute('x'), e.getAttribute('y'), e.getAttribute('text-anchor') || ''];
    var d = e.getAttribute('d'); if (d) rec.d = d.length > 900 ? d.slice(0, 900) + '...' : d;
    var pn = e.parentNode; if (pn && pn.tagName === 'g') rec.pg = pn.getAttribute('transform') || '';
    out.els.push(rec);
  });
  /* hit-test each label anchor / pin: what is actually drawn at that coordinate */
  function hits(vx, vy) {
    var cx = gr.left + vx * scale, cy = gr.top + vy * scale;
    return document.elementsFromPoint(cx, cy).filter(function (e) { return e.hasAttribute && e.hasAttribute('data-qa'); })
      .map(function (e) { return +e.getAttribute('data-qa'); });
  }
  out.anchors = [];
  els.forEach(function (e, i) {
    if (e.tagName !== 'circle') return;
    var r = +e.getAttribute('r');
    if (r !== 2.2 && r !== 10) return;
    var vx = +e.getAttribute('cx'), vy = +e.getAttribute('cy');
    out.anchors.push({ i: i, r: r, at: [vx, vy], hits: hits(vx, vy) });
  });
  out.scale = scale;
  var txt = 'QAJSON' + JSON.stringify(out) + 'ENDQA';
  document.getElementById('dump').textContent = txt;
  try { if (parent !== window) parent.document.getElementById('d').textContent = txt; } catch (e) {}
}
requestAnimationFrame(function () { requestAnimationFrame(function () { setTimeout(go, 160); }); });
</script>
