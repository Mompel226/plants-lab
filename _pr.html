<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="css/app.css">
<style>body{margin:0;background:#fff}#j{font:9px monospace;white-space:pre-wrap;word-break:break-all}</style>
<script>
/* force the settled frame: no timers, no race */
var _mm = window.matchMedia.bind(window);
window.matchMedia = function(q){ if(q.indexOf('prefers-reduced-motion')>=0) return {matches:true,media:q,addEventListener:function(){},removeEventListener:function(){},addListener:function(){},removeListener:function(){}}; return _mm(q); };
</script>
<div id="o" style="padding:8px"></div>
<pre id="j"></pre>
<script src="js/data/glossary.js"></script><script src="js/data/photos.js"></script>
<script src="js/plant.js"></script><script src="js/plant-draw.js"></script>
<script src="js/terms.js"></script><script src="js/widgets.js"></script><script src="js/learn.js"></script>
<script src="_probe.js"></script>
<script>
var P=new URLSearchParams(location.search);
var clicks=JSON.parse(decodeURIComponent(P.get('c')||'[]'));
var w=window.Learn.widget({type:'auxin',title:'The auxin experiments',ask:'a'},{});
document.getElementById('o').appendChild(w);
var applied=[];
clicks.forEach(function(l){ var ps=w.querySelectorAll('.ax__lamp'), done=false;
  for(var i=0;i<ps.length;i++){ if(ps[i].textContent===l){ps[i].click();done=true;break;} }
  applied.push(l+'='+done); });
function go(){
  try{
    var o=window.__sum(document);
    o.on=[].slice.call(w.querySelectorAll('.ax__lamp.is-on')).map(function(b){return b.textContent;});
    o.applied=applied; o.href=location.href;
    document.getElementById('j').textContent='###'+JSON.stringify(o)+'###';
  }catch(e){ document.getElementById('j').textContent='###ERR '+e.message+'###'; }
}
requestAnimationFrame(function(){requestAnimationFrame(function(){setTimeout(go,120);});});
</script>
